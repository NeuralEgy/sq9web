# Nginx — بلوك TLS افتراضي للسيرفر كله.
#
# المشكلة اللي بيحلها:
#   مفيش ولا بلوك على 443 متعرّف كـdefault_server، ونجينكس بيحمّل
#   sites-enabled/* أبجديًا — يبقى acc هو أول بلوك 443، وبالتالي هو
#   الافتراضي. النتيجة إن أي اسم دومين متوجّه للسيرفر ده ومالوش بلوك
#   TLS بتاعه كان بيرد بشهادة acc.hurghada.cloud وبيعرض تطبيق Neural.
#
# الحل: بلوك افتراضي صريح يرفض المصافحة من أصلها.
#
# 🔴 ssl_reject_handshake معناها إن نجينكس **ما بيقدّمش شهادة خالص**
#    للأسماء المش معروفة، وبيقفل الاتصال على مستوى TLS. يعني مفيش
#    تطبيق بيترد ومفيش شهادة بتتسرّب باسم دومين تاني.
#    محتاجة nginx >= 1.19.4 — السيرفر عليه 1.24.0.
#
# 🔴 الأسماء المعروفة ما بتتأثرش. نجينكس بيطابق server_name الأول،
#    وما بيرجعش للافتراضي غير لما ما يلاقيش. acc وsq9 وn8n وwhatsapp
#    وneural وbaqi كلهم زي ما هم بالظبط.
#
# ⚠️ أي عميل بيتصل من غير SNI (اتصال بالـIP مباشرة، أو عملاء قديمة
#    جدًا) هيتقفل عليه كمان. وده المقصود — بس لو عندك مراقبة بتضرب
#    على https://187.124.35.60 مباشرة، هتبطّل تشتغل.
#
# بورت 80 مش محتاج حاجة: بلوك acc على 80 بيرد 404 لأي اسم مش بتاعه،
# فمفيش تطبيق بيتعرض على HTTP أصلًا.

server {
    listen      443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_reject_handshake on;
}
