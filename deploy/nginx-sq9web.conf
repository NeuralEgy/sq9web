# Nginx — sq9web.hurghada.cloud (نسخة مراجعة موقع Square9)
#
# 🔴 بلوك server **منفصل تمامًا** في ملف لوحده. ما بيلمسش
#    sq9.hurghada.cloud (webhook الـagent) ولا whatsapp.hurghada.cloud
#    ولا أي بلوك تاني على السيرفر.
#
# بعد ما يتحط، certbot هو اللي بيضيف سطور TLS لوحده:
#   certbot --nginx -d sq9web.hurghada.cloud

server {
    listen 80;
    listen [::]:80;
    server_name sq9web.hurghada.cloud;

    access_log /var/log/nginx/sq9web-access.log;
    error_log  /var/log/nginx/sq9web-error.log;

    # الصور كبيرة شوية والفورم صغير — 2 ميجا أكتر من كفاية
    client_max_body_size 2m;

    # ملفات Next الثابتة بهاش في اسمها، فتتكاش سنة من غير خوف
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3032;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # 🔴 X-Forwarded-For هو اللي حاجز المعدّل في /api/visits بيقرا منه.
        #    من غيره كل الزوار بيبقوا عنوان واحد وأول خمس حجوزات بتقفل الفورم على الكل.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
